name: Build EXE for TestDriver
env:
  DEBUG: napi:*

on:
  pull_request:

jobs:
  build:
    name: build windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - name: Install pnpm explicitly
        run: |
          npm install -g pnpm
          pnpm --version  # Verify pnpm is installed and available

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          architecture: x64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          
      - name: Install dependencies (root)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install dependencies (examples/api)
        working-directory: examples/api
        run: pnpm i

      - name: Build CLI
        run: pnpm run build:cli
        shell: bash

      - name: Build API
        run: pnpm run build:api
        shell: bash
        
      - name: Run app in dev mode (background)
        working-directory: examples/api
        run: |
          Start-Process -NoNewWindow -FilePath "cmd.exe" -ArgumentList "/c pnpm tauri dev"
        shell: powershell

      - name: Build API Example App
        working-directory: examples/api
        run: pnpm tauri build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-x86_64-pc-windows-msvc
          path: target\release\bundle\nsis\*
          if-no-files-found: error

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-executable
          path: target\debug\api
          if-no-files-found: error

      - name: Set environment variables
        run: |
          echo "GITHUB_REPOSITORY=${{ github.repository }}" >> $GITHUB_ENV
          echo "GITHUB_RUN_ID=${{ github.run_id }}" >> $GITHUB_ENV

      - uses: testdriverai/action@main
        with:
          key: ${{ secrets.TESTDRIVER_API_KEY }}
          prompt: | 
            1. /run testdriver/tauri_api_install.yml
            # 2. /run testdriver/dark_light_mode.yml
            # 3. /run testdriver/minimize_maximize.yml
            2. /run testdriver/comm_echo.yml
            3. /run testdriver/comm_send_event_rust.yml
            4. /run testdriver/comm_spam.yml
            5. /run testdriver/comm_call_request_api.yml
            # 7. /run testdriver/comm_call_log_api.yml
            
          prerun: |
            $headers = @{
                Authorization = "token ${{ secrets.GITHUB_TOKEN }}"
            }
    
            $downloadFolder = "./download"
    
            function Download-And-Extract-Artifact($artifactName) {
                Write-Host "Fetching the artifact upload URL for $artifactName..."
                $artifactUrl = (Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" -Headers $headers).artifacts | Where-Object { $_.name -eq $artifactName } | Select-Object -ExpandProperty archive_download_url
    
                if ($artifactUrl) {
                    Write-Host "Artifact URL successfully fetched for $artifactName: $artifactUrl"
                } else {
                    Write-Error "Failed to fetch the artifact URL for $artifactName."
                    exit 1
                }
    
                $artifactZipPath = "$env:TEMP\$artifactName.zip"
                try {
                    Invoke-WebRequest -Uri $artifactUrl -Headers $headers -OutFile $artifactZipPath
                    Write-Host "Artifact $artifactName downloaded successfully."
                } catch {
                    Write-Error "Error downloading artifact $artifactName: $_"
                    exit 1
                }
    
                $artifactUnzipPath = "$env:TEMP\$artifactName"
                Write-Host "Unzipping $artifactName to $artifactUnzipPath..."
                try {
                    Expand-Archive -Path $artifactZipPath -DestinationPath $artifactUnzipPath -Force
                    Write-Host "Artifact $artifactName unzipped successfully."
                } catch {
                    Write-Error "Failed to unzip $artifactName: $_"
                    exit 1
                }
    
                return $artifactUnzipPath
            }
    
            # Download and extract main EXE
            $exePath = Download-And-Extract-Artifact "bindings-x86_64-pc-windows-msvc"
    
            # Download and extract API executable
            $apiPath = Download-And-Extract-Artifact "api-executable"
    
            # Find the main EXE
            $artifactInstallerPath = Get-ChildItem -Path $exePath -Filter *.exe -Recurse | Select-Object -First 1
            if ($artifactInstallerPath) {
                Write-Host "Main executable found: $($artifactInstallerPath.FullName)"
            } else {
                Write-Error "Main executable not found. Exiting."
                exit 1
            }
    
            # Find the API executable
            $apiExecutablePath = Get-ChildItem -Path $apiPath -Filter "api" -Recurse | Select-Object -First 1
            if ($apiExecutablePath) {
                Write-Host "API executable found: $($apiExecutablePath.FullName)"
            } else {
                Write-Error "API executable not found. Exiting."
                exit 1
            }
    
            # Start the API executable in the background
            Write-Host "Starting API executable..."
            Start-Process -NoNewWindow -FilePath $apiExecutablePath.FullName
    
            # Start the main executable
            Write-Host "Running main installer: $($artifactInstallerPath.FullName)..."
            Start-Process -FilePath $artifactInstallerPath.FullName
          
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_COLOR: "3"
